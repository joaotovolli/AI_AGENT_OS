name: CI

on:
  push:
    branches: [main, 'agent/**']
    paths-ignore: ['STATUS.md', 'state/**', 'docs/**']
  pull_request:
    paths-ignore: ['STATUS.md', 'state/**', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Validate Python, shell and browser JavaScript
        run: |
          python -m compileall -q agent_os scripts tests
          bash -n scripts/install-wsl.sh
          node --check agent_os/static/app.js
      - name: Run regression and integration tests
        run: python -m unittest discover -s tests -v
      - name: Check tracked content for credentials and runtime files
        run: python scripts/check_repository.py

  browser:
    name: Dashboard browser workflow
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/agent-os-browser" playwright@1.62.1
          "$RUNNER_TEMP/agent-os-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Exercise dashboard in Chromium
        run: NODE_PATH="$RUNNER_TEMP/agent-os-browser/node_modules" node tests/browser_smoke.cjs
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-browser-evidence
          path: browser-artifacts/
          if-no-files-found: ignore
          retention-days: 14
